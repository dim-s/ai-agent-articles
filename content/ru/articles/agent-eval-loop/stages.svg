<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="'Golos Text', 'IBM Plex Sans', system-ui, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#888780"/>
    </marker>
    <marker id="ap" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#a63f24"/>
    </marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#639922"/>
    </marker>
  </defs>

  <rect width="900" height="440" fill="#fffcf6"/>
  <text x="450" y="32" text-anchor="middle" font-size="16" font-weight="600" fill="#2c2c2a">Стадии постройки агента: test и iterate - это ЦИКЛ, а не прямая</text>
  <text x="450" y="52" text-anchor="middle" font-size="12.5" fill="#7a786f">всё до петли - подготовка входа; всё после - следствие того, что петля сошлась</text>

  <!-- дашед-кластер вокруг test+iterate -->
  <rect x="522" y="112" width="196" height="250" rx="12" fill="#faf9ff" stroke="#dfa88f" stroke-width="1.3" stroke-dasharray="5 5"/>
  <text x="620" y="104" text-anchor="middle" font-size="12" font-weight="600" fill="#a63f24">петля - сердце (Рис. 1)</text>

  <!-- DESIGN -->
  <rect x="28" y="138" width="140" height="76" rx="10" fill="#f1efe8" stroke="#b4b2a9" stroke-width="1.3"/>
  <text x="98" y="170" text-anchor="middle" font-size="14.5" font-weight="700" fill="#2c2c2a">Design</text>
  <text x="98" y="190" text-anchor="middle" font-size="11.5" fill="#5f5e5a">зачем он,</text>
  <text x="98" y="205" text-anchor="middle" font-size="11.5" fill="#5f5e5a">не дубль ли</text>

  <!-- DRAFT -->
  <rect x="196" y="138" width="140" height="76" rx="10" fill="#f1efe8" stroke="#b4b2a9" stroke-width="1.3"/>
  <text x="266" y="170" text-anchor="middle" font-size="14.5" font-weight="700" fill="#2c2c2a">Draft</text>
  <text x="266" y="190" text-anchor="middle" font-size="11.5" fill="#5f5e5a">собрать из</text>
  <text x="266" y="205" text-anchor="middle" font-size="11.5" fill="#5f5e5a">шаблона</text>

  <!-- TUNE -->
  <rect x="364" y="138" width="140" height="76" rx="10" fill="#f1efe8" stroke="#b4b2a9" stroke-width="1.3"/>
  <text x="434" y="170" text-anchor="middle" font-size="14.5" font-weight="700" fill="#2c2c2a">Tune</text>
  <text x="434" y="190" text-anchor="middle" font-size="11.5" fill="#5f5e5a">отшлифовать</text>
  <text x="434" y="205" text-anchor="middle" font-size="11.5" fill="#5f5e5a">формулировки</text>

  <!-- TEST (центр тяжести) -->
  <rect x="540" y="138" width="160" height="76" rx="10" fill="#a63f24"/>
  <text x="620" y="170" text-anchor="middle" font-size="15" font-weight="700" fill="#fffcf6">Test</text>
  <text x="620" y="190" text-anchor="middle" font-size="11.5" fill="#f7e7dc">прогон по сценариям</text>
  <text x="620" y="205" text-anchor="middle" font-size="11.5" fill="#f7e7dc">- центр тяжести</text>

  <!-- PROMOTE -->
  <rect x="735" y="138" width="140" height="76" rx="10" fill="#e1f5ee" stroke="#5dcaa5" stroke-width="1.4"/>
  <text x="805" y="170" text-anchor="middle" font-size="14.5" font-weight="700" fill="#04342c">Promote</text>
  <text x="805" y="190" text-anchor="middle" font-size="11.5" fill="#0f6e56">в бой - только</text>
  <text x="805" y="205" text-anchor="middle" font-size="11.5" fill="#0f6e56">когда петля сошлась</text>

  <!-- ITERATE -->
  <rect x="540" y="270" width="160" height="76" rx="10" fill="#fbf7ec" stroke="#e0c987" stroke-width="1.4"/>
  <text x="620" y="302" text-anchor="middle" font-size="15" font-weight="700" fill="#8a6d1f">Iterate</text>
  <text x="620" y="322" text-anchor="middle" font-size="11.5" fill="#5d554a">правка промпта</text>
  <text x="620" y="337" text-anchor="middle" font-size="11.5" fill="#5d554a">по провалу</text>

  <!-- линейные стрелки -->
  <line x1="168" y1="176" x2="194" y2="176" stroke="#888780" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="336" y1="176" x2="362" y2="176" stroke="#888780" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="504" y1="176" x2="538" y2="176" stroke="#888780" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="700" y1="176" x2="733" y2="176" stroke="#639922" stroke-width="1.8" marker-end="url(#ag)"/>
  <text x="717" y="132" text-anchor="middle" font-size="11" font-weight="600" fill="#3f6015">весь набор PASS</text>

  <!-- test <-> iterate цикл -->
  <line x1="596" y1="214" x2="596" y2="268" stroke="#a63f24" stroke-width="1.8" marker-end="url(#ap)"/>
  <text x="586" y="245" text-anchor="end" font-size="11" font-weight="600" fill="#b5462e">FAIL/</text>
  <text x="586" y="258" text-anchor="end" font-size="11" font-weight="600" fill="#b5462e">PARTIAL</text>
  <path d="M648,268 Q670,241 648,216" fill="none" stroke="#a63f24" stroke-width="1.8" marker-end="url(#ap)"/>
  <text x="680" y="245" font-size="11" fill="#a63f24">перепрогон</text>

  <text x="450" y="392" text-anchor="middle" font-size="13" fill="#5d554a">Design → draft → tune - подготовка входа в петлю. Test ⇄ iterate - сама петля. Promote - когда сошлась.</text>
  <text x="450" y="414" text-anchor="middle" font-size="12.5" fill="#8a8073">Тест - не финальная печать, а центр тяжести: тут агент либо доказывает надёжность, либо возвращается на доработку.</text>
</svg>
