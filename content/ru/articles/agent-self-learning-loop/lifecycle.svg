<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'Golos Text', 'IBM Plex Sans', system-ui, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#a63f24"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#fffcf6"/>

  <!-- Источник сигнала -->
  <rect x="150" y="24" width="600" height="52" rx="8" fill="#fdf6f0" stroke="#ecc8b4"/>
  <text x="450" y="46" text-anchor="middle" font-size="15" font-weight="600" fill="#221e1a">Провал пойман</text>
  <text x="450" y="65" text-anchor="middle" font-size="12.5" fill="#5d554a">менеджер-гейт · ревьювер · отклонённая проверка · коррекция владельца</text>

  <!-- гейт входа -->
  <line x1="450" y1="76" x2="450" y2="120" stroke="#a63f24" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="466" y="102" font-size="12.5" font-style="italic" fill="#a63f24">гейт входа: урок или разовость?</text>

  <!-- CANDIDATE -->
  <rect x="270" y="124" width="360" height="78" rx="10" fill="#fbf7ec" stroke="#e0c987" stroke-width="1.5"/>
  <text x="450" y="152" text-anchor="middle" font-size="17" font-weight="700" fill="#8a6d1f" font-family="monospace">candidate</text>
  <text x="450" y="174" text-anchor="middle" font-size="12.5" fill="#5d554a">карантин - наблюдается, копит свидетельства,</text>
  <text x="450" y="190" text-anchor="middle" font-size="12.5" fill="#5d554a">но поведение НЕ меняет</text>

  <!-- гейт доверия -->
  <line x1="450" y1="202" x2="450" y2="248" stroke="#a63f24" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="466" y="230" font-size="12.5" font-style="italic" fill="#a63f24">гейт доверия: повторился + подтвердился + не навредил?</text>

  <!-- ACTIVE -->
  <rect x="270" y="252" width="360" height="78" rx="10" fill="#a63f24"/>
  <text x="450" y="280" text-anchor="middle" font-size="17" font-weight="700" fill="#fffcf6" font-family="monospace">active</text>
  <text x="450" y="302" text-anchor="middle" font-size="12.5" fill="#f7e7dc">в лёгком индексе, всплывает по триггеру,</text>
  <text x="450" y="318" text-anchor="middle" font-size="12.5" fill="#f7e7dc">меняет поведение агентов</text>

  <!-- retired -->
  <line x1="450" y1="330" x2="450" y2="376" stroke="#9a9aa5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="466" y="358" font-size="12.5" font-style="italic" fill="#77777f">устарел / оказался неверным</text>

  <rect x="300" y="380" width="300" height="52" rx="10" fill="#f0f0f2" stroke="#cdcdd4"/>
  <text x="450" y="404" text-anchor="middle" font-size="15" font-weight="600" fill="#77777f" font-family="monospace">retired</text>
  <text x="450" y="422" text-anchor="middle" font-size="12" fill="#8a8073">отозван, но след в git остаётся</text>

  <!-- боковая подпись: предохранитель -->
  <line x1="270" y1="163" x2="120" y2="163" stroke="#ecc8b4" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="112" y="150" text-anchor="end" font-size="12" font-weight="600" fill="#a63f24">карантин =</text>
  <text x="112" y="167" text-anchor="end" font-size="12" fill="#5d554a">предохранитель</text>
  <text x="112" y="183" text-anchor="end" font-size="12" fill="#5d554a">от отравления</text>

  <!-- боковая подпись: суждение -->
  <line x1="630" y1="291" x2="742" y2="291" stroke="#ecc8b4" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="750" y="285" font-size="12" fill="#5d554a">повышает не счётчик,</text>
  <text x="750" y="301" font-size="12" fill="#5d554a">а суждение судьи</text>

  <!-- подпись внизу -->
  <text x="450" y="470" text-anchor="middle" font-size="13" fill="#8a8073">Три состояния, не больше. Всё plain-text под git - деградация видима в диффе и обратима.</text>
</svg>
