<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="'Golos Text', 'IBM Plex Sans', system-ui, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#888780"/>
    </marker>
  </defs>

  <rect width="900" height="540" fill="#fffcf6"/>
  <text x="450" y="34" text-anchor="middle" font-size="16" font-weight="600" fill="#2c2c2a">Три уровня recall: у каждого свой размен надёжности и стоимости</text>
  <text x="450" y="54" text-anchor="middle" font-size="12.5" fill="#7a786f">память помогает и не раздувает контекст - чем ближе к горячему пути, тем осторожнее грузим</text>

  <!-- левая ось «когда грузится» -->
  <line x1="52" y1="86" x2="52" y2="452" stroke="#b8b6ae" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="40" y="120" font-size="11.5" fill="#7a786f" transform="rotate(-90 40 270)" text-anchor="middle">всегда и дёшево  →  по нужде и точечно</text>

  <!-- УРОВЕНЬ 0 -->
  <rect x="88" y="84" width="740" height="106" rx="10" fill="#fdf6f0" stroke="#ecc8b4" stroke-width="1.5"/>
  <rect x="104" y="100" width="150" height="74" rx="8" fill="#a63f24"/>
  <text x="179" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#fffcf6">Уровень 0</text>
  <text x="179" y="153" text-anchor="middle" font-size="12.5" fill="#f7e7dc">ВСЕГДА на старте</text>
  <text x="274" y="125" font-size="15.5" font-weight="700" fill="#6e2a17">Лёгкий индекс active-уроков</text>
  <text x="274" y="148" font-size="12.5" fill="#5d554a">строчка на урок; берёшь на борт мишени и триггеры.</text>
  <text x="274" y="166" font-size="12.5" fill="#5d554a">Промах recall дороже лёгкого индекса - потому безусловно.</text>

  <!-- УРОВЕНЬ 1 -->
  <rect x="88" y="204" width="740" height="106" rx="10" fill="#f6f5fc" stroke="#cdc9ec" stroke-width="1.5"/>
  <rect x="104" y="220" width="150" height="74" rx="8" fill="#c2633f"/>
  <text x="179" y="252" text-anchor="middle" font-size="14" font-weight="700" fill="#fffcf6">Уровень 1</text>
  <text x="179" y="273" text-anchor="middle" font-size="12.5" fill="#eeecfb">по ТРИГГЕРУ</text>
  <text x="274" y="245" font-size="15.5" font-weight="700" fill="#6e2a17">Полное тело урока</text>
  <text x="274" y="268" font-size="12.5" fill="#5d554a">тянется, только когда триггер совпал с текущей задачей.</text>
  <text x="274" y="286" font-size="12.5" fill="#5d554a">Индекс лёгкий и всегда; тяжёлое тело - по требованию.</text>

  <!-- УРОВЕНЬ 2 -->
  <rect x="88" y="324" width="740" height="106" rx="10" fill="#fbf7ec" stroke="#e0c987" stroke-width="1.5"/>
  <rect x="104" y="340" width="150" height="74" rx="8" fill="#d99b2b"/>
  <text x="179" y="372" text-anchor="middle" font-size="14" font-weight="700" fill="#fffcf6">Уровень 2</text>
  <text x="179" y="393" text-anchor="middle" font-size="12.5" fill="#fdf3e0">по ЗАПРОСУ</text>
  <text x="274" y="365" font-size="15.5" font-weight="700" fill="#8a6d1f">Кандидаты - гипотезы</text>
  <text x="274" y="388" font-size="12.5" fill="#5d554a">в горячий путь не грузятся; агент лезет сам, когда упёрся.</text>
  <text x="274" y="406" font-size="12.5" fill="#5d554a">Берёт как зацепку, не правило - сырое не рулит поведением.</text>

  <text x="450" y="470" text-anchor="middle" font-size="13" fill="#5d554a">«Понять, что урок релевантен» - хрупко; «читать индекс всегда» - не промахивается.</text>
  <text x="450" y="492" text-anchor="middle" font-size="12.5" fill="#8a8073">Полный текст правила в индекс не кладётся - он в теле урока, тянется по триггеру.</text>
</svg>
