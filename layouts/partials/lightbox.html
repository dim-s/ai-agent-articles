{{- /* Лайтбокс на нативном <dialog>: фокус-трап, Escape и возврат фокуса — от платформы.
       Без JS ссылка просто открывает картинку отдельной страницей (прогрессивное улучшение). */ -}}
<dialog class="lightbox" id="lightbox" aria-label="{{ i18n "image_view" }}">
  <button type="button" class="lightbox__close" autofocus data-lightbox-close aria-label="{{ i18n "changelog_close" }}">&times;</button>
  <img alt="" id="lightbox-img">
</dialog>
<script>
(function () {
  var lb = document.getElementById('lightbox'), img = document.getElementById('lightbox-img');
  if (!lb || !img || typeof lb.showModal !== 'function') return;
  document.addEventListener('click', function (e) {
    var a = e.target.closest('.lightbox-link');
    if (a) {
      e.preventDefault();
      var inner = a.querySelector('img');
      img.src = a.getAttribute('href'); img.alt = inner ? inner.getAttribute('alt') : '';
      lb.showModal();
      return;
    }
    if (e.target.closest('[data-lightbox-close]') || e.target === lb) lb.close();
  });
  lb.addEventListener('close', function () { img.removeAttribute('src'); });
})();
</script>
